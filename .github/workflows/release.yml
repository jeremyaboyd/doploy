# Pushing a v* tag builds binaries for every platform and publishes a GitHub
# release with them attached. The version baked into `doploy --version` comes
# from the tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""
              [ "$os" = "windows" ] && ext=".exe"
              echo "building $os/$arch"
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 \
                go build -trimpath \
                  -ldflags "-s -w -X main.version=$version" \
                  -o "dist/doploy-${version}-${os}-${arch}${ext}" \
                  ./cmd/doploy
            done
          done
          (cd dist && sha256sum * > checksums.txt)

      # A release made through the GitHub UI creates the tag and the release
      # together, so by the time this job runs the release may already exist.
      # Create it only if missing, then attach the assets either way.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
