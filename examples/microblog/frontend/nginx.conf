server {
    listen 80;
    # Also bind IPv6 so anything resolving localhost to ::1 inside the
    # container reaches nginx rather than getting connection refused.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Must be at least MAX_UPLOAD_MB from doploy.yml, or nginx rejects large
    # attachments before the API ever sees them.
    client_max_body_size 512m;

    # Uploads and downloads of large video can outlast the defaults.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # The API runs in a sibling container on the same compose network, so
    # "api" resolves via Docker's DNS.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamed downloads should not be buffered to disk first.
        proxy_buffering off;
    }

    # Hashed assets are immutable; the entry HTML must never be cached or a
    # deploy leaves clients on stale JavaScript.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: unknown paths fall through to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
